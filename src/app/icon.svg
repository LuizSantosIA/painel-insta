<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4F8CFF"/>
      <stop offset="100%" stop-color="#7C5CFF"/>
    </linearGradient>
    <linearGradient id="ring" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00D4FF"/>
      <stop offset="100%" stop-color="#4F8CFF"/>
    </linearGradient>
  </defs>
  <!-- Fundo arredondado -->
  <rect width="32" height="32" rx="8" fill="url(#bg)"/>
  <!-- Corpo da câmera -->
  <rect x="5" y="11" width="22" height="15" rx="3" fill="white" opacity="0.15"/>
  <rect x="5" y="11" width="22" height="15" rx="3" fill="none" stroke="white" stroke-width="1.5" opacity="0.9"/>
  <!-- Saliência superior (visor) -->
  <path d="M12 11 L12 8.5 Q12 7 13.5 7 L18.5 7 Q20 7 20 8.5 L20 11Z" fill="white" opacity="0.9"/>
  <!-- Lente — anel externo -->
  <circle cx="16" cy="18.5" r="4.5" fill="none" stroke="url(#ring)" stroke-width="1.5"/>
  <!-- Lente — círculo interno -->
  <circle cx="16" cy="18.5" r="2.5" fill="white" opacity="0.9"/>
  <!-- Indicador LED -->
  <circle cx="22.5" cy="14" r="1" fill="#00D4FF" opacity="0.9"/>
</svg>
